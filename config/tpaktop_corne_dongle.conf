# Increase the dongle's wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keymap processing lives on the dongle central.
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# Broadcast keyboard status for an external Prospector Scanner.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="TPAK"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="AUX"
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2

# Fetch both halves' battery levels for Prospector (hardware-accepted 2026-10-18).
# See docs/prospector-battery-test.md.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Publish both peripheral levels to the BLE host (e.g. zmk-battery-center).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
