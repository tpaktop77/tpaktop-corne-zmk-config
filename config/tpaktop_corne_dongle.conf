# Increase the dongle's wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keymap processing lives on the dongle central.
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# Intentionally disabled for two peripherals on ZMK v0.3.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
